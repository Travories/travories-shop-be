services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medusashop-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        - NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY=${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY:-}
        - NEXT_PUBLIC_MEDUSA_BACKEND_URL=${NEXT_PUBLIC_MEDUSA_BACKEND_URL:-}
    container_name: medusashop-storefront
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production

  nginx:
    image: nginx:alpine
    container_name: medusashop-nginx
    restart: unless-stopped
    ports:
      - "${PORT_FE:-80}:80"
      - "${PORT_BE:-9000}:9000"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - storefront
