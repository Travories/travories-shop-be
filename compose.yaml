services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medusashop-backend
    restart: unless-stopped
    # Bound to localhost only — public traffic comes through Caddy over HTTPS.
    ports:
      - "127.0.0.1:9000:9000"
    env_file:
      - .env
    environment:
      NODE_ENV: production

  caddy:
    image: caddy:2-alpine
    container_name: medusashop-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
